name: Pamplejuce

on:
  workflow_dispatch: # lets you run a build from the UI
  workflow_call: # lets other workflows (like nightly.yml) call this one
  push:
  pull_request:

# When pushing new commits, cancel any running builds on that branch
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  BUILD_DIR: Builds
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  SCCACHE_GHA_ENABLED: true
  SCCACHE_CACHE_MULTIARCH: 1
  IPP_DIR: C:\Program Files (x86)\Intel\oneAPI\ipp\latest\lib\cmake\ipp

defaults:
  run:
    shell: bash

# jobs are run in parallel on different machines
# all steps run in series
jobs:
  build_and_test:
    # don't double run on PRs
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # show all errors for each platform (vs. cancel jobs on error)
      matrix:
        include:
          - name: macOS
            os: macos-14
            pluginval-binary: pluginval.app/Contents/MacOS/pluginval
            extra-flags: -G Ninja -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          - name: Windows
            os: windows-latest
            pluginval-binary: ./pluginval.exe
            # Use the MSVC compiler exposed by msvc-dev-cmd instead of
            # clang-cl + Ninja. This avoids the current CMake/Ninja
            # clang-cl toolchain mismatch on GitHub-hosted Windows runners.
            extra-flags: -G Ninja -DCMAKE_C_COMPILER=cl.exe -DCMAKE_CXX_COMPILER=cl.exe -DCMAKE_MSVC_WARNING_LEVEL=4

    steps:
      # Setup MSVC toolchain and developer command prompt (Windows)
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install IPP (Windows)
        if: (runner.os == 'Windows')
        run: |
          nuget install intelipp.static.win-x64 -Version 2026.0.0.712

      - name: Install Ninja (Windows)
        if: (runner.os == 'Windows')
        run: choco install ninja

      - name: Install macOS Deps
        if: ${{ runner.os == 'macOS' }}
        run: brew install ninja osxutils

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache the build
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure
        run: |
          # Do not pass slash-prefixed MSVC flags through the Git Bash path
          # converter. In particular, /WX- becomes C:/Program Files/Git/WX-
          # and breaks CMake's compiler test. Warning policy is controlled by
          # CMake instead of injecting raw slash flags here.
          cmake -B ${{ env.BUILD_DIR }} -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE}} -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache ${{ matrix.extra-flags }} .

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }} --config ${{ env.BUILD_TYPE }}

      - name: Test & Benchmarks
        working-directory: ${{ env.BUILD_DIR }}
        run: ctest --verbose --output-on-failure

      - name: Set additional env vars for next steps
        run: |
          # 1. Hardcode variables from CMakeLists.txt
          PROJECT_NAME="HomeSidechain"
          PRODUCT_NAME="Home-Sidechain"
          # 2. Read the version directly from the file!
          VERSION=$(cat VERSION | tr -d '[:space:]')

          # 3. Add them to GITHUB_ENV
          echo "PROJECT_NAME=$PROJECT_NAME" >> $GITHUB_ENV
          echo "PRODUCT_NAME=$PRODUCT_NAME" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          
          # 4. Define paths using the local shell variables
          ARTIFACTS_PATH=${{ env.BUILD_DIR }}
          TRIGGER_ARTIFACTS_PATH=${{ env.BUILD_DIR }}/HomeSidechainTrigger_artefacts/${{ env.BUILD_TYPE }}
          RECEIVER_ARTIFACTS_PATH=${{ env.BUILD_DIR }}/HomeSidechainReceiver_artefacts/${{ env.BUILD_TYPE }}
          echo "ARTIFACTS_PATH=$ARTIFACTS_PATH" >> $GITHUB_ENV
          echo "TRIGGER_ARTIFACTS_PATH=$TRIGGER_ARTIFACTS_PATH" >> $GITHUB_ENV
          echo "RECEIVER_ARTIFACTS_PATH=$RECEIVER_ARTIFACTS_PATH" >> $GITHUB_ENV
          echo "TRIGGER_VST3_PATH=$TRIGGER_ARTIFACTS_PATH/VST3/Home-Sidechain Trigger.vst3" >> $GITHUB_ENV
          echo "RECEIVER_VST3_PATH=$RECEIVER_ARTIFACTS_PATH/VST3/Home-Sidechain Receiver.vst3" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=${PRODUCT_NAME}-${VERSION}-${{ runner.os }}" >> $GITHUB_ENV

      - name: Pluginval
        run: |
          curl -LO "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_${{ runner.os }}.zip"
          7z x pluginval_${{ runner.os }}.zip
          ${{ matrix.pluginval-binary }} --strictness-level 10 --verbose --validate "${{ env.TRIGGER_VST3_PATH }}"
          ${{ matrix.pluginval-binary }} --strictness-level 10 --verbose --validate "${{ env.RECEIVER_VST3_PATH }}"

      # - name: Import Certificates (macOS)
      #   uses: sudara/basic-macos-keychain-action@v1
      #   id: keychain
      #   if: ${{ runner.os == 'macOS'}}
      #   with:
      #     dev-id-app-cert: ${{ secrets.DEV_ID_APP_CERT }}
      #     dev-id-app-password: ${{ secrets.DEV_ID_APP_PASSWORD }}
      #     dev-id-installer-cert: ${{ secrets.DEV_ID_INSTALLER_CERT }}
      #     dev-id-installer-password: ${{ secrets.DEV_ID_INSTALLER_PASSWORD }}

      # - name: Codesign (macOS)
      #   if: ${{ runner.os == 'macOS' }}
      #   timeout-minutes: 5
      #   run: |
      #     # Each plugin must be code signed
      #     codesign --force --keychain ${{ steps.keychain.outputs.keychain-path }} -s "${{ secrets.DEVELOPER_ID_APPLICATION}}" -v "${{ env.VST3_PATH }}" --deep --strict --options=runtime --timestamp
      #     codesign --force --keychain ${{ steps.keychain.outputs.keychain-path }} -s "${{ secrets.DEVELOPER_ID_APPLICATION}}" -v "${{ env.AU_PATH }}" --deep --strict --options=runtime --timestamp
      #     codesign --force --keychain ${{ steps.keychain.outputs.keychain-path }} -s "${{ secrets.DEVELOPER_ID_APPLICATION}}" -v "${{ env.CLAP_PATH }}" --deep --strict --options=runtime --timestamp
      #     codesign --force --keychain ${{ steps.keychain.outputs.keychain-path }} -s "${{ secrets.DEVELOPER_ID_APPLICATION}}" -v "${{ env.STANDALONE_PATH }}" --deep --strict --options=runtime --timestamp

      - name: Package both plugins (macOS)
        if: ${{ runner.os == 'macOS' }}
        run: |
          mkdir -p "Artifacts/Home-Sidechain"
          cp -R "${{ env.TRIGGER_ARTIFACTS_PATH }}/VST3/Home-Sidechain Trigger.vst3" "Artifacts/Home-Sidechain/"
          cp -R "${{ env.RECEIVER_ARTIFACTS_PATH }}/VST3/Home-Sidechain Receiver.vst3" "Artifacts/Home-Sidechain/"
          cd Artifacts/Home-Sidechain && 7z a "../${{ env.ARTIFACT_NAME }}.zip" .

      - name: Package both plugins (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: |
          mkdir -p "Artifacts/Home-Sidechain"
          cp -R "${{ env.TRIGGER_ARTIFACTS_PATH }}/VST3/Home-Sidechain Trigger.vst3" "Artifacts/Home-Sidechain/"
          cp -R "${{ env.RECEIVER_ARTIFACTS_PATH }}/VST3/Home-Sidechain Receiver.vst3" "Artifacts/Home-Sidechain/"
          cd Artifacts/Home-Sidechain && 7z a "../${{ env.ARTIFACT_NAME }}.zip" .

      - name: Upload combined package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}.zip
          path: "Artifacts/${{ env.ARTIFACT_NAME }}.zip"

  release:
    if: contains(github.ref, 'tags/v')
    runs-on: ubuntu-latest
    needs: build_and_test

    steps:
      - name: Get Artifacts
        uses: actions/download-artifact@v8

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          # download-artifact puts these files in their own dirs...
          # Using globs sidesteps having to pass the version around
          files: |
            */*.exe
            */*.zip
            */*.dmg